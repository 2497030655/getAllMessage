<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: gap: https://ssl.gstatic.com 'unsafe-eval' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: content: https: http:; connect-src 'self' http://* ws://* https://* wss://*; media-src *;">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <link rel="stylesheet" href="css/index.css">
  <title>消息助手</title>
</head>
<body>
  <div id="app">
    <header class="topbar">
      <button type="button" id="btnBack" class="icon-btn hidden" aria-label="返回">‹</button>
      <div class="top-title">
        <div id="titleMain">消息</div>
        <div id="titleSub" class="sub">启动中…</div>
      </div>
      <button type="button" id="btnRefresh" class="icon-btn" aria-label="刷新">↻</button>
    </header>

    <section id="viewList" class="view">
      <div id="convEmpty" class="empty">暂无会话<br>等 PC 端连上云端并收到私信后会出现在这里</div>
      <ul id="convList" class="conv-list"></ul>
    </section>

    <section id="viewChat" class="view hidden">
      <div id="msgList" class="msg-list"></div>
      <form id="sendForm" class="composer">
        <input id="msgInput" type="text" placeholder="输入回复…" autocomplete="off" maxlength="2000">
        <button id="btnSend" type="submit">发送</button>
      </form>
    </section>
  </div>

  <script src="cordova.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
